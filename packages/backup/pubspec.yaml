# Protobuf schema, export and import, restore planner.
#
# Field numbers are append-only, so a backup taken by a newer build stays readable by an older
# one and vice versa.
#
# See docs/architecture.md section 2.4. Folder name is short; the package name carries the
# kikuyomi_ prefix so it cannot collide with a published package.
name: kikuyomi_backup
description: "Protobuf schema, export and import, restore planner."
version: 0.1.0
publish_to: none

# Member of the pub workspace rooted at ../../pubspec.yaml.
resolution: workspace

environment:
  sdk: "^3.13.3"

dependencies:
  # Int64, which the generated code uses for every 64-bit field.
  fixnum: ^1.1.0
  kikuyomi_domain:
    path: ../domain
  # Runtime for the code generated from proto/backup.proto (ADR-0008). Pure Dart, so it runs on
  # Android, iOS and Windows alike.
  protobuf: ^6.1.0

dev_dependencies:
  kikuyomi_test_support:
    path: ../test_support
  test: ^1.25.0
