# Fakes, fixtures, an in-memory database and a fake clock.
#
# Depended on only by other packages' dev_dependencies.
#
# See docs/architecture.md section 2.4. Folder name is short; the package name carries the
# kikuyomi_ prefix so it cannot collide with a published package.
name: kikuyomi_test_support
description: "Fakes, fixtures, an in-memory database and a fake clock."
version: 0.1.0
publish_to: none

# Member of the pub workspace rooted at ../../pubspec.yaml.
resolution: workspace

environment:
  sdk: "^3.13.3"

dependencies:
  kikuyomi_domain:
    path: ../domain
  kikuyomi_source_api:
    path: ../source_api

dev_dependencies:
  test: ^1.25.0
