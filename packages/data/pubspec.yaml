# Drift schema, migrations, repository implementations, mappers and merge rules.
#
# The database is the single source of truth. Every schema change ships with a migration and a
# migration test against the generated schema snapshots.
#
# See docs/architecture.md section 2.4. Folder name is short; the package name carries the
# kikuyomi_ prefix so it cannot collide with a published package.
name: kikuyomi_data
description: "Drift schema, migrations, repository implementations, mappers and merge rules."
version: 0.1.0
publish_to: none

# Member of the pub workspace rooted at ../../pubspec.yaml.
resolution: workspace

environment:
  sdk: "^3.13.3"

dependencies:
  drift: ^2.35.0
  kikuyomi_domain:
    path: ../domain
  # The extension contract, so that a source's results can be mapped onto the §4.4 merges. Pure
  # Dart, like this package; nothing here runs an extension.
  kikuyomi_source_api:
    path: ../source_api

dev_dependencies:
  kikuyomi_test_support:
    path: ../test_support
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  test: ^1.25.0
