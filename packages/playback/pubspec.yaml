# `PlaybackCoordinator`, progress store, sleep timer and resume rules.
#
# The audio engine sits behind an interface so this logic can be tested against a fake engine and
# a controllable clock.
#
# See docs/architecture.md section 2.4. Folder name is short; the package name carries the
# kikuyomi_ prefix so it cannot collide with a published package.
name: kikuyomi_playback
description: "`PlaybackCoordinator`, progress store, sleep timer and resume rules."
version: 0.1.0
publish_to: none

# Member of the pub workspace rooted at ../../pubspec.yaml.
resolution: workspace

environment:
  sdk: "^3.13.3"

dependencies:
  kikuyomi_domain:
    path: ../domain

dev_dependencies:
  test: ^1.25.0
