# Theme, typography, components, adaptive scaffolds and image loading.
#
# Depends on Flutter but not on the domain: components take values, not entities.
#
# See docs/architecture.md section 2.4. Folder name is short; the package name carries the
# kikuyomi_ prefix so it cannot collide with a published package.
name: kikuyomi_design_system
description: "Theme, typography, components, adaptive scaffolds and image loading."
version: 0.1.0
publish_to: none

# Member of the pub workspace rooted at ../../pubspec.yaml.
resolution: workspace

environment:
  sdk: "^3.13.3"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
