# The versioned contract that source extensions implement.
#
# DTOs, the `ContentSource` interface, filters, settings, capabilities and the API version
# constant. This is a public API: changes are additive within a minor version, and a breaking
# change is a major version with a published deprecation window.
#
# See docs/architecture.md section 2.4. Folder name is short; the package name carries the
# kikuyomi_ prefix so it cannot collide with a published package.
name: kikuyomi_source_api
description: "The versioned contract that source extensions implement."
version: 0.1.0
publish_to: none

# Member of the pub workspace rooted at ../../pubspec.yaml.
resolution: workspace

environment:
  sdk: "^3.13.3"

dev_dependencies:
  test: ^1.25.0
