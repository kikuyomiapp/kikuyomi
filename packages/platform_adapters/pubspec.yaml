# Per-OS implementations of the interfaces the pure packages declare.
#
# Audio backend, media session, download transport, storage locations, folder access, secure
# storage, WebView challenge, power policy and diagnostics. Platform differences live here, so
# features never contain a `Platform.isX` check.
#
# See docs/architecture.md section 2.4. Folder name is short; the package name carries the
# kikuyomi_ prefix so it cannot collide with a published package.
name: kikuyomi_platform_adapters
description: "Per-OS implementations of the interfaces the pure packages declare."
version: 0.1.0
publish_to: none

# Member of the pub workspace rooted at ../../pubspec.yaml.
resolution: workspace

environment:
  sdk: "^3.13.3"

dependencies:
  flutter:
    sdk: flutter
  kikuyomi_domain:
    path: ../domain
  kikuyomi_playback:
    path: ../playback
  kikuyomi_downloads:
    path: ../downloads
  kikuyomi_source_runtime:
    path: ../source_runtime
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  # Names a cached stream's file after where its bytes came from, so that a reused file id can
  # never serve one book's audio for another's. Dart team, BSD-3-Clause, pure Dart: Android,
  # Windows and iOS alike. Already the app's.
  crypto: ^3.0.6
  media_kit_libs_windows_audio: ^1.0.9
  path_provider: ^2.1.6
  # §5.2's transport, behind ADR-0007's interface: it delegates to WorkManager on Android, a
  # background URLSession on iOS and an in-process isolate on desktop, which is the one thing no
  # amount of Dart can do for itself. Android, Windows and iOS all supported, which is why it was
  # chosen over writing three platform implementations by hand. MIT.
  background_downloader: ^9.2.0
  audio_session: ^0.2.4
  audio_service: ^0.18.19
  desktop_drop: ^0.8.4
  # Windows only: `audio_service` has no Windows implementation, so the media keys and the volume
  # flyout come through SMTC instead (§6.5). Builds a Rust crate, so building for Windows needs
  # rustup.
  smtc_windows: ^1.1.0
  # Not used directly. Pinned to the version `smtc_windows` generated its bindings with and pins its
  # Rust crate to: a newer Dart runtime refuses to load them, and the controls would fail at start.
  # Move it only together with `smtc_windows`.
  flutter_rust_bridge: 2.11.1
  # §4.3's settings store. Flutter-team maintained, BSD-3-Clause, on Android, iOS and Windows.
  shared_preferences: ^2.5.5
  # The platform's folder dialog, for choosing a backup folder on desktop (§5.1). Already the app's
  # for adding books.
  file_selector: ^1.1.0
  # Android's Storage Access Framework (§5.1): a document tree picked with a persistable permission,
  # and listing, renaming and deleting documents in it. BSD-3-Clause; Android only, so the adapter
  # uses it only there.
  saf_util: ^3.1.0
  # Reading and writing documents in such a tree. BSD-3-Clause; Android only, like saf_util.
  saf_stream: ^4.0.1
  # ADR-0001's QuickJS binding, vendored as Kikuyomi's fork outside the workspace. MIT; Android,
  # Windows, iOS, macOS and Linux. See third_party/flutter_qjs/README.kikuyomi.md.
  flutter_qjs:
    path: ../../third_party/flutter_qjs

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Its in-memory store, standing in for the platform's in tests. Already resolved through
  # shared_preferences.
  shared_preferences_platform_interface: ^2.4.2
