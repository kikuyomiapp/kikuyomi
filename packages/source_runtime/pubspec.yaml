# QuickJS host, bridges, worker isolate pool, watchdog and output validation.
#
# Extension output is untrusted. It is decoded into strict types and validated at this boundary
# before anything else in the app sees it.
#
# See docs/architecture.md section 2.4. Folder name is short; the package name carries the
# kikuyomi_ prefix so it cannot collide with a published package.
name: kikuyomi_source_runtime
description: "QuickJS host, bridges, worker isolate pool, watchdog and output validation."
version: 0.1.0
publish_to: none

# Member of the pub workspace rooted at ../../pubspec.yaml.
resolution: workspace

environment:
  sdk: "^3.13.3"

dependencies:
  kikuyomi_source_api:
    path: ../source_api
  kikuyomi_networking:
    path: ../networking
  # The html bridge (§3.5): the Dart team's parser, the one spikes/html_selectors measured, whose
  # selector gaps SourceAPI 1.0 turns into refusals rather than wrong answers. BSD-3-Clause, pure
  # Dart, so Android, Windows and iOS alike.
  html: ^0.15.6
  # The crypto bridge's hashes and HMAC. Dart team, BSD-3-Clause, pure Dart.
  crypto: ^3.0.6
  # The crypto bridge's AES. Pure Dart, MIT, and the only maintained AES implementation with CBC,
  # CTR and GCM in one package. It reads a site's own responses and never touches media (§7.1).
  pointycastle: ^4.0.0

dev_dependencies:
  test: ^1.25.0
  # MockClient, for answering an extension's requests without a socket: the allowlist refuses IP
  # addresses on purpose, so a local server cannot stand in for a site here. Already resolved
  # through kikuyomi_networking.
  http: ^1.5.0
