# Runs the QuickJS binding probe (spike (a)) on Android emulators.
#
# ADR-0001 chose a vendored fork of flutter_qjs, in third_party/flutter_qjs, and was accepted once
# its probe passed here on Android, the other primary target. The development machine cannot run
# an emulator, so the proof runs on GitHub's Linux runners, which have KVM, and runs again whenever
# the fork or the probe changes, so that the answer stays true.
#
# Kept apart from ci.yml on purpose. It builds a throwaway spike rather than the app, it takes
# several minutes of emulator time, and it only has anything new to say when the fork or the probe
# changes. Pushes that touch neither do not run it; workflow_dispatch runs it on demand.
name: Android emulator (QuickJS probe)

on:
  push:
    paths:
      - "third_party/flutter_qjs/**"
      - "spikes/quickjs_binding/**"
      - ".github/workflows/android-emulator.yml"
  workflow_dispatch:

# Its own group, so it never cancels or is cancelled by a CI run for the same ref.
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned as in ci.yml; bump both together.
  FLUTTER_VERSION: "3.47.3"
  JAVA_VERSION: "21"

jobs:
  build:
    name: Build probe APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The probe is not a workspace member, so it resolves on its own, against the fork by path.
      - name: Resolve probe
        run: flutter pub get
        working-directory: spikes/quickjs_binding/qjs_probe

      # x86_64 only: that is what the emulators run, and it spares building QuickJS for ABIs
      # nothing here would load. Release mode, so the numbers come from AOT code as a user's would.
      - name: Build APK
        run: flutter build apk --release --target-platform android-x64
        working-directory: spikes/quickjs_binding/qjs_probe

      - uses: actions/upload-artifact@v4
        with:
          name: qjs-probe-apk
          path: spikes/quickjs_binding/qjs_probe/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Probe on API ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Each API level is its own answer; one failing must not hide the other's.
      fail-fast: false
      matrix:
        # 26 is the app's minimum (ADR-0012). 35 stands for current Android.
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qjs-probe-apk
          path: probe-apk

      # Hardware acceleration for the emulator. The runner has /dev/kvm, but only root may open it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The action runs each line of `script` as a separate shell, so the logic lives in a script
      # file. Two cores, because the parallel-runtimes probe needs two threads on the CPU at once.
      - name: Run probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash spikes/quickjs_binding/run_probe_on_device.sh probe-apk/app-release.apk probe-logs/api-${{ matrix.api-level }} 180

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qjs-probe-log-api-${{ matrix.api-level }}
          path: probe-logs/
          if-no-files-found: warn
          retention-days: 30
