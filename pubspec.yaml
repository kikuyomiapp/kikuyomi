# Dart pub workspace root for Kikuyomi.
#
# This is not a package anyone depends on; it exists so that `flutter pub get` here resolves
# every member against one shared version solution and one `pubspec.lock`. Members list
# `resolution: workspace` in their own pubspec.
#
# Members are listed in dependency order, following the package map in docs/architecture.md §2.4.
name: kikuyomi_workspace
description: Pub workspace root for Kikuyomi. Not a publishable package.
publish_to: none

environment:
  sdk: ^3.13.3

workspace:
  - app
  - packages/source_api
  - packages/domain
  - packages/data
  - packages/networking
  - packages/source_runtime
  - packages/sources_builtin
  - packages/extension_manager
  - packages/downloads
  - packages/playback
  - packages/backup
  - packages/sync
  - packages/platform_adapters
  - packages/design_system
  - packages/test_support
