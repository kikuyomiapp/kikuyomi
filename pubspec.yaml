# Dart pub workspace root for Kikuyomi.
#
# This is not a package anyone depends on; it exists so that `flutter pub get` here resolves
# every member against one shared version solution and one `pubspec.lock`. Members list
# `resolution: workspace` in their own pubspec.
#
# Packages under `packages/` arrive in Phase 1 and are added to the `workspace` list below as
# they are created. See docs/architecture.md §2.4 for the target package map.
name: kikuyomi_workspace
description: Pub workspace root for Kikuyomi. Not a publishable package.
publish_to: none

environment:
  sdk: ^3.13.3

workspace:
  - app
